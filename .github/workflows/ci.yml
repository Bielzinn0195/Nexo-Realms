name: CI
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate:data
      - run: npm run typecheck
      - run: npm run build\n      - run: npm run smoke:server
